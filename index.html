<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Live Turkish → English Translator</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#0f1115; --panel:#181b22; --text:#f2f4f8; --muted:#8a93a6; --accent:#4f8cff; --red:#ff5a5f; --size:28px; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; height:100vh; display:flex; flex-direction:column; }
  header { display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:12px 16px; background:var(--panel); border-bottom:1px solid #262b36; }
  header h1 { font-size:16px; margin:0 12px 0 0; font-weight:600; }
  button, select { background:#232836; color:var(--text); border:1px solid #333a4a; border-radius:8px; padding:8px 14px; font-size:14px; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); font-weight:600; }
  button.stop { background:var(--red); border-color:var(--red); }
  #status { margin-left:auto; font-size:13px; color:var(--muted); display:flex; align-items:center; gap:6px; }
  #dot { width:10px; height:10px; border-radius:50%; background:#555; }
  #dot.on { background:var(--red); animation:pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity:.3; } }
  label { font-size:13px; color:var(--muted); display:flex; align-items:center; gap:6px; }
  main { flex:1; overflow-y:auto; padding:20px 24px 40px; }
  .line { margin-bottom:18px; }
  .en { font-size:var(--size); line-height:1.35; }
  .tr { font-size:calc(var(--size) * 0.55); color:var(--muted); margin-top:4px; }
  .live .en { color:#b9c3d8; font-style:italic; }
  .hidden-tr .tr { display:none; }
  #empty { color:var(--muted); font-size:18px; text-align:center; margin-top:15vh; line-height:1.6; }
</style>
</head>
<body>
<header>
  <h1>🎤 Turkish → English</h1>
  <button id="toggle" class="primary">Start listening</button>
  <button id="clear">Clear</button>
  <button id="save">Save transcript</button>
  <label>Text size
    <select id="size">
      <option value="20px">Small</option>
      <option value="28px" selected>Medium</option>
      <option value="38px">Large</option>
      <option value="50px">Huge</option>
    </select>
  </label>
  <label><input type="checkbox" id="showTr" checked> Show Turkish</label>
  <div id="status"><span id="dot"></span><span id="statusText">Idle</span></div>
</header>
<main id="out">
  <div id="empty">Click <b>Start listening</b> and allow the microphone.<br>
  Turkish speech near your laptop will appear here in English.<br>
  <small>Works in Google Chrome or Microsoft Edge (needs internet).</small></div>
</main>

<script>
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const out = document.getElementById('out');
const toggleBtn = document.getElementById('toggle');
const statusText = document.getElementById('statusText');
const dot = document.getElementById('dot');
let rec = null, running = false, liveEl = null, liveTimer = null, liveSeq = 0;
const transcript = [];

function setStatus(t, on) { statusText.textContent = t; dot.classList.toggle('on', !!on); }

async function translate(text) {
  const url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=tr&tl=en&dt=t&q=' + encodeURIComponent(text);
  const r = await fetch(url);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const data = await r.json();
  return data[0].map(p => p[0]).join('');
}

function makeLine(cls) {
  const empty = document.getElementById('empty'); if (empty) empty.remove();
  const div = document.createElement('div');
  div.className = 'line ' + (cls || '');
  div.innerHTML = '<div class="en"></div><div class="tr"></div>';
  out.appendChild(div);
  return div;
}
function scrollDown() { out.scrollTop = out.scrollHeight; }

async function addFinal(trText) {
  trText = trText.trim(); if (!trText) return;
  if (liveEl) { liveEl.remove(); liveEl = null; }
  liveSeq++;
  const el = makeLine();
  el.querySelector('.tr').textContent = trText;
  el.querySelector('.en').textContent = '…';
  scrollDown();
  try {
    const en = await translate(trText);
    el.querySelector('.en').textContent = en;
    transcript.push({ tr: trText, en });
  } catch (e) {
    el.querySelector('.en').textContent = '[translation failed – check internet] ' + trText;
    transcript.push({ tr: trText, en: '' });
  }
  scrollDown();
}

function showInterim(trText) {
  trText = trText.trim(); if (!trText) return;
  if (!liveEl) { liveEl = makeLine('live'); }
  liveEl.querySelector('.tr').textContent = trText;
  scrollDown();
  clearTimeout(liveTimer);
  const mySeq = liveSeq;
  liveTimer = setTimeout(async () => {
    try {
      const en = await translate(trText);
      if (liveEl && mySeq === liveSeq) { liveEl.querySelector('.en').textContent = en; scrollDown(); }
    } catch (e) {}
  }, 500);
}

function start() {
  if (!SR) { alert('Speech recognition is not supported in this browser. Please open this page in Google Chrome or Microsoft Edge.'); return; }
  rec = new SR();
  rec.lang = 'tr-TR';
  rec.continuous = true;
  rec.interimResults = true;
  rec.onresult = (ev) => {
    let interim = '';
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      const res = ev.results[i];
      if (res.isFinal) addFinal(res[0].transcript);
      else interim += res[0].transcript;
    }
    if (interim) showInterim(interim);
  };
  rec.onerror = (ev) => {
    if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') {
      setStatus('Microphone blocked – allow it in the address bar', false);
      running = false; updateBtn();
    } else if (ev.error !== 'no-speech' && ev.error !== 'aborted') {
      setStatus('Error: ' + ev.error + ' (retrying)', true);
    }
  };
  rec.onend = () => { if (running) { try { rec.start(); } catch (e) { setTimeout(() => running && rec.start(), 300); } } else setStatus('Stopped', false); };
  running = true;
  rec.start();
  setStatus('Listening…', true);
  updateBtn();
}

function stop() { running = false; if (rec) rec.stop(); updateBtn(); setStatus('Stopped', false); }
function updateBtn() {
  toggleBtn.textContent = running ? 'Stop' : 'Start listening';
  toggleBtn.className = running ? 'stop' : 'primary';
}

toggleBtn.onclick = () => running ? stop() : start();
document.getElementById('clear').onclick = () => { out.innerHTML = ''; transcript.length = 0; liveEl = null; };
document.getElementById('size').onchange = (e) => document.documentElement.style.setProperty('--size', e.target.value);
document.getElementById('showTr').onchange = (e) => out.classList.toggle('hidden-tr', !e.target.checked);
document.getElementById('save').onclick = () => {
  const txt = transcript.map(l => 'EN: ' + l.en + '\nTR: ' + l.tr).join('\n\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([txt], { type: 'text/plain' }));
  a.download = 'lesson-transcript-' + new Date().toISOString().slice(0,16).replace(/[:T]/g,'-') + '.txt';
  a.click();
};
</script>
</body>
</html>
